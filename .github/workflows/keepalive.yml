name: Keep Supabase Awake

on:
  schedule:
    # Run every 3 days at 00:00 UTC (cron expression)
    - cron: '0 0 */3 * *'
  # Allow manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "%{http_code}" -H "apikey: ${{ env.SUPABASE_ANON_KEY }}" -H "Authorization: Bearer ${{ env.SUPABASE_ANON_KEY }}" "https://jypdrvdhqffcolplwxvi.supabase.co/rest/v1/observations?select=id&limit=1"
        env:
          SUPABASE_ANON_KEY: "sb_publishable__tmP1Pe7MUYpF_Ains6peA_hapgNrba"
